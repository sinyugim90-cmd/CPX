<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEEF5">
<title>CPX Study</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CPX">
<link rel="stylesheet" href="assets/style.css?v=11">
</head>
<body>
<div class="ticker"><div class="tk" id="tk"></div></div>
<div class="scroll"><div class="w">
  <header class="mast">
    <h1>실기<em class="chrome">스터디</em></h1>
    <div class="strip">
      <div><b id="ovP">0%</b><span>learned</span></div>
      <div><b id="ovN">0</b><span>cards</span></div>
      <div><b id="ovR">0</b><span>retry</span></div>
    </div>
  </header>
  <div class="search"><span id="sic"></span>
    <input id="q" type="search" placeholder="질환 · 문진 · 검사 이름으로 찾기" autocomplete="off"></div>
  <div id="results" class="hide"></div>
  <div id="list"></div>
  <div class="foot">진행률은 이 기기에 저장돼요.<br>
    <button id="exp">내보내기</button> &nbsp;·&nbsp; <button id="imp">불러오기</button> &nbsp;·&nbsp; <button id="rst">전부 초기화</button>
    <input id="impFile" type="file" accept="application/json" class="hide"></div>
</div></div>
<div class="install" id="install">
  <p id="instMsg">홈 화면에 추가하면 앱처럼 전체화면으로 열리고, 오프라인에서도 돼요.</p>
  <div class="r"><button id="instNo">나중에</button><button class="p" id="instGo">추가</button></div>
</div>
<script type="module">
import { $, $$, loadIndex, loadCC, ccStat, getCard, exportProgress, importProgress, resetAll, registerSW, installPrompt, strip } from './assets/store.js?v=11';
import { ICON, toast, dial, animateDials } from './assets/ui.js?v=11';
import { applyPrefOnly } from './assets/enhance.js?v=11';
applyPrefOnly(); registerSW(); installPrompt();
$('#sic').innerHTML = ICON.search;
const d = new Date();
$('#tk').innerHTML = `<span>CPX Study</span><span>${d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</span><span>Vol. 25–27</span>`;

let INDEX = null, SEARCH = null;
async function draw() {
  INDEX = await loadIndex();
  let tot = 0, ok = 0, bad = 0; const out = [];
  for (const part of INDEX.parts) {
    const rows = [];
    for (const cc of part.ccs) {
      if (cc.status !== 'ready') { rows.push(`<div class="blk soon"><div class="no">${cc.num}</div><h3>${cc.title}</h3><div class="en">coming soon</div></div>`); continue; }
      const data = await loadCC(cc.id);
      const s = ccStat(cc.id, data.decks.map(d => d.cards.length));
      let b = 0; data.decks.forEach((d, di) => d.cards.forEach((_, ci) => { if (getCard(cc.id, di, ci).ok === false) b++; }));
      tot += s.total; ok += s.ok; bad += b;
      rows.push(`<a class="blk" href="decks.html?cc=${cc.id}">
        ${b ? `<span class="tag">Retry ${b}</span>` : (s.pct === 100 ? `<span class="tag">Complete</span>` : '')}
        <div class="no chrome">${cc.num}</div>
        <div class="pr"><b>${s.pct}%</b>${dial(s.pct)}</div>
        <h3>${cc.title}</h3><div class="en">${cc.en} · ${s.total} cards</div></a>`);
    }
    out.push(`<div class="sech"><h2>${part.name}</h2><span>${part.ccs.filter(c => c.status === 'ready').length} / ${part.ccs.length}</span></div>${rows.join('')}`);
  }
  $('#list').innerHTML = out.join('');
  $('#ovP').textContent = (tot ? Math.round(ok / tot * 100) : 0) + '%';
  $('#ovN').textContent = tot; $('#ovR').textContent = bad;
  animateDials();

}
draw();

async function buildSearch() {
  if (SEARCH) return SEARCH; SEARCH = [];
  for (const part of INDEX.parts) for (const cc of part.ccs) {
    if (cc.status !== 'ready') continue;
    const data = await loadCC(cc.id);
    data.decks.forEach((d, di) => d.cards.forEach((c, ci) => SEARCH.push({ cc: cc.id, num: cc.num, deck: d.t, di, ci, title: c.t,
      text: strip(c.f.big + ' ' + (c.f.nm || '') + ' ' + (c.f.chips || []).join(' ') + ' ' + c.b) })));
  }
  return SEARCH;
}
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
let timer = null;
$('#q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => run(e.target.value.trim()), 160); });
async function run(q) {
  const R = $('#results'), L = $('#list');
  if (q.length < 2) { R.classList.add('hide'); L.classList.remove('hide'); return; }
  const idx = await buildSearch(); const rx = new RegExp(esc(q), 'i');
  const hits = idx.filter(h => rx.test(h.title) || rx.test(h.text)).slice(0, 40);
  L.classList.add('hide'); R.classList.remove('hide');
  if (!hits.length) { R.innerHTML = '<p class="empty">찾은 게 없어요.</p>'; return; }
  R.innerHTML = hits.map(h => {
    const m = h.text.match(new RegExp('.{0,40}' + esc(q) + '.{0,60}', 'i'));
    const snip = (m ? m[0] : h.text.slice(0, 90)).replace(rx, s => '<mark>' + s + '</mark>');
    return `<a class="hit" href="cards.html?cc=${h.cc}&d=${h.di}&i=${h.ci}"><div class="loc">CPX ${h.num} · ${h.deck}</div><div class="t">${h.title}</div><div class="x">${snip}</div></a>`;
  }).join('');
}
$('#exp').onclick = exportProgress;
$('#imp').onclick = () => $('#impFile').click();
$('#impFile').onchange = e => { if (!e.target.files[0]) return; importProgress(e.target.files[0], ok => { toast(ok ? '불러왔어요' : '파일을 읽지 못했어요'); if (ok) setTimeout(() => location.reload(), 600); }); };
$('#rst').onclick = () => { if (confirm('진행률을 전부 지울까요?')) { resetAll(); location.reload(); } };
</script>
</body>
</html>

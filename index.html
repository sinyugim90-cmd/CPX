<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F4F4">
<meta name="description" content="CPX 실기 스터디 — CC별 가이드와 인출 카드">
<title>CPX Study</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CPX">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="scroll">
  <div class="hero"><div class="w">
    <div class="kick">CPX STUDY</div>
    <h1>실기 스터디</h1>
    <p class="subt">CC별 가이드와 인출 카드</p>
    <div class="stats">
      <div><b id="ovCC">0</b><span>CC</span></div>
      <div><b id="ovN">0</b><span>카드</span></div>
      <div><b id="ovP">0%</b><span>외운 비율</span></div>
    </div>
  </div></div>

  <div class="w">
    <div class="search"><span class="ic">&#9906;</span>
      <input id="q" type="search" placeholder="질환 · 문진 · 검사 이름으로 찾기" autocomplete="off"></div>
    <div id="results" class="hide"></div>
    <div id="list"></div>
    <div class="foot">
      진행률은 이 기기에 저장돼요. 방문 기록을 지우면 사라집니다.<br>
      <button id="exp">내보내기</button> · <button id="imp">불러오기</button> ·
      <button id="rst">전부 초기화</button>
      <input id="impFile" type="file" accept="application/json" class="hide">
    </div>
  </div>
</div>

<div class="install" id="install">
  <p id="instMsg">홈 화면에 추가하면 앱처럼 전체화면으로 열리고, 오프라인에서도 볼 수 있어요.</p>
  <div class="r"><button id="instNo">나중에</button><button class="p" id="instGo">추가</button></div>
</div>

<script type="module">
import { $, $$, loadIndex, loadCC, ccStat, exportProgress, importProgress,
         resetAll, registerSW, installPrompt, strip } from './assets/store.js';
import { applyPrefOnly, highlight } from './assets/enhance.js';
applyPrefOnly();

registerSW();
installPrompt();

let INDEX = null;
let SEARCH = null;   // 지연 로딩 검색 인덱스

async function draw() {
  INDEX = await loadIndex();
  let totCards = 0, totOk = 0, nReady = 0;
  const parts = [];

  for (const part of INDEX.parts) {
    const tiles = [];
    for (const cc of part.ccs) {
      if (cc.status !== 'ready') {
        tiles.push(`<div class="ccrow soon"><span class="no">${cc.num}</span>
          <div class="mid"><b>${cc.title}</b><span>준비 중</span></div></div>`);
        continue;
      }
      nReady++;
      const data = await loadCC(cc.id);
      const counts = data.decks.map(d => d.cards.length);
      const s = ccStat(cc.id, counts);
      totCards += s.total; totOk += s.ok;
      tiles.push(`<button class="ccrow" data-cc="${cc.id}">
        <span class="no">${cc.num}</span>
        <div class="mid"><b>${cc.title}</b><span>${cc.en}</span></div>
        <div class="ring" style="background:conic-gradient(var(--burg) ${s.pct*3.6}deg,var(--hair) 0deg)">
          <b>${s.pct}</b></div>
      </button>`);
    }
    parts.push(`<div class="parth"><em>${part.tag}</em><h2>${part.name}</h2>
      <span class="cnt">${part.ccs.filter(c => c.status === 'ready').length} / ${part.ccs.length}</span></div>
      <div class="ccbox">${tiles.join('')}</div>`);
  }

  $('#list').innerHTML = parts.join('');
  $('#ovCC').textContent = nReady;
  $('#ovN').textContent = totCards;
  $('#ovP').textContent = (totCards ? Math.round(totOk / totCards * 100) : 0) + '%';

  $$('#list .ccrow[data-cc]').forEach(t =>
    t.addEventListener('click', () => location.href = 'decks.html?cc=' + t.dataset.cc));
}
draw();

/* ── 검색 ── */
async function buildSearch() {
  if (SEARCH) return SEARCH;
  SEARCH = [];
  for (const part of INDEX.parts) {
    for (const cc of part.ccs) {
      if (cc.status !== 'ready') continue;
      const data = await loadCC(cc.id);
      data.decks.forEach((d, di) => d.cards.forEach((c, ci) => {
        SEARCH.push({
          cc: cc.id, num: cc.num, ccTitle: cc.title, deck: d.t, di, ci,
          title: c.t, text: strip(c.f.big + ' ' + (c.f.nm || '') + ' ' + (c.f.mt || '') + ' ' +
                                  (c.f.chips || []).join(' ') + ' ' + c.b)
        });
      }));
    }
  }
  return SEARCH;
}
let timer = null;
$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => run(e.target.value.trim()), 180);
});
async function run(q) {
  const R = $('#results'), L = $('#list');
  if (q.length < 2) { R.classList.add('hide'); L.classList.remove('hide'); return; }
  const idx = await buildSearch();
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
  const hits = idx.filter(h => rx.test(h.title) || rx.test(h.text)).slice(0, 40);
  L.classList.add('hide'); R.classList.remove('hide');
  if (!hits.length) { R.innerHTML = '<p class="sub">찾은 게 없어요.</p>'; return; }
  R.innerHTML = hits.map(h => {
    const m = h.text.match(new RegExp('.{0,40}' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '.{0,60}', 'i'));
    const snip = (m ? m[0] : h.text.slice(0, 90))
      .replace(rx, s => '<mark>' + s + '</mark>');
    return `<a class="hit" href="cards.html?cc=${h.cc}&d=${h.di}&i=${h.ci}">
      <div class="loc">CPX ${h.num} · ${h.deck}</div>
      <div class="t">${h.title}</div><div class="x">${snip}</div></a>`;
  }).join('');
}

/* ── 진행률 도구 ── */
$('#exp').addEventListener('click', exportProgress);
$('#imp').addEventListener('click', () => $('#impFile').click());
$('#impFile').addEventListener('change', e => {
  if (!e.target.files[0]) return;
  importProgress(e.target.files[0], ok => {
    alert(ok ? '불러왔어요.' : '파일을 읽지 못했어요.');
    if (ok) location.reload();
  });
});
$('#rst').addEventListener('click', () => {
  if (confirm('진행률을 전부 지울까요? 되돌릴 수 없어요.')) { resetAll(); location.reload(); }
});
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEEF5">
<title>CPX Study</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/style.css?v=11">
</head>
<body>
<div class="scroll">
  <div class="hub"><div class="in">
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0 6px;padding-top:calc(10px + env(safe-area-inset-top))">
      <a class="sq" href="index.html" id="bk"></a>
      <span class="lab" id="sb"></span>
    </div>
    <div class="no chrome" id="hno"></div>
    <h1 id="hti"></h1><div class="en" id="hen"></div>
    <div class="kk">
      <div><b id="kOk">0</b><span>learned</span></div>
      <div><b id="kRead">0</b><span>read</span></div>
      <div><b id="kBad">0</b><span>retry</span></div>
    </div>
  </div></div>
  <div class="w">
    <div class="modes">
      <a class="mode lime" id="mCard"><span class="lab" id="lC"></span><h3>카드 인출</h3><p id="cMeta"></p>
        <div class="seg" id="cSeg"></div><div class="pc" id="cPc"></div></a>
      <a class="mode" id="mRead"><span class="lab" id="lR"></span><h3>학습모드</h3><p id="rMeta"></p>
        <div class="seg" id="rSeg"></div><div class="pc" id="rPc"></div></a>
    </div>
    <div class="sech"><h2>Decks</h2><span id="dcnt"></span></div>
    <div id="list"></div>
    <div class="links"><a id="pl" target="_blank"><span id="ipdf"></span>PDF</a><a id="gl"><span id="ibook"></span>가이드 전문</a></div>
  </div>
</div>
<script type="module">
import { $, loadIndex, loadCC, loadRead, deckStat, ccStat, guideStat, getCard, qs, registerSW } from './assets/store.js?v=11';
import { ICON } from './assets/ui.js?v=11';
import { applyPrefOnly } from './assets/enhance.js?v=11';
applyPrefOnly(); registerSW();
$('#bk').innerHTML = ICON.back; $('#lC').textContent = '01 — Recall'; $('#lR').textContent = '02 — Read';
$('#ipdf').innerHTML = ICON.pdf; $('#ibook').innerHTML = ICON.book;
const id = qs('cc');
(async () => {
  const idx = await loadIndex(); let meta = null;
  idx.parts.forEach(p => p.ccs.forEach(c => { if (c.id === id) meta = c; }));
  if (!meta) { location.href = 'index.html'; return; }
  const data = await loadCC(id);
  document.title = `CPX ${meta.num} ${meta.title}`;
  $('#sb').textContent = `CPX ${meta.num}`; $('#hno').textContent = meta.num;
  $('#hti').textContent = meta.title; $('#hen').textContent = meta.en;
  $('#mRead').href = 'read.html?cc=' + id; $('#mCard').href = 'cards.html?cc=' + id + '&d=0';
  $('#gl').href = 'guide.html?cc=' + id; $('#pl').href = 'guides/' + meta.guide + '.pdf';
  const s = ccStat(id, data.decks.map(d => d.cards.length));
  let bad = 0; data.decks.forEach((d, di) => d.cards.forEach((_, ci) => { if (getCard(id, di, ci).ok === false) bad++; }));
  const doc = await loadRead(id); const g = guideStat(id, doc.parts.map(p => p.secs.length));
  $('#kOk').textContent = s.ok; $('#kRead').textContent = g.done; $('#kBad').textContent = bad;
  $('#cMeta').textContent = `${data.decks.length} decks · ${s.total} cards`; $('#cPc').textContent = `${s.pct}%`;
  $('#rMeta').textContent = `${doc.parts.length} parts · ${g.total} sections`; $('#rPc').textContent = `${g.pct}%`;
  requestAnimationFrame(() => requestAnimationFrame(() => { $('#cSeg').style.setProperty('--pct', s.pct + '%'); $('#rSeg').style.setProperty('--pct', g.pct + '%'); }));
  $('#dcnt').textContent = String(data.decks.length).padStart(2, '0');
  $('#list').innerHTML = data.decks.map((d, di) => {
    const st = deckStat(id, di, d.cards.length);
    return `<a class="deck${st.pct === 100 ? ' done' : ''}" href="cards.html?cc=${id}&d=${di}">
      <div class="n">${String(di + 1).padStart(2, '0')}</div>
      <div class="t"><b>${d.t}</b><span>${d.d}</span></div>
      <div class="e">${st.pct}%<small>${d.cards.length} cards</small></div></a>`;
  }).join('');

})();
</script>
</body>
</html>

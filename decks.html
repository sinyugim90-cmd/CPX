<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F1">
<title>CPX Study</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="bar"><div class="in">
  <a class="bk" href="index.html" id="bk"></a>
  <div><div class="ti">CPX Study</div><div class="sb" id="sb"></div></div>
</div></div>

<div class="scroll"><div class="w">
  <div class="hub">
    <div class="no" id="hno"></div>
    <div class="mid"><h1 id="hti"></h1><div class="en" id="hen"></div></div>
    <div id="hring"></div>
  </div>
  <div class="hubline" id="hline"></div>

  <div class="modes">
    <a class="mode" id="mRead">
      <span class="lab" id="lRead">Read</span>
      <h3>학습모드</h3><p id="rMeta"></p>
      <div class="pb"><i id="rBar"></i></div><div class="pc" id="rPc"></div></a>
    <a class="mode" id="mCard">
      <span class="lab" id="lCard">Recall</span>
      <h3>카드 인출</h3><p id="cMeta"></p>
      <div class="pb"><i id="cBar"></i></div><div class="pc" id="cPc"></div></a>
  </div>

  <div class="sec"><h2>카드 덱</h2><span class="cnt" id="dcnt"></span></div>
  <div class="idx" id="list"></div>

  <div class="linkline">
    <a id="pl" target="_blank"><span id="ipdf"></span>PDF 내려받기</a>
    <a id="gl"><span id="ibook"></span>가이드 전문</a>
  </div>
</div></div>

<script type="module">
import { $, $$, loadIndex, loadCC, loadRead, deckStat, ccStat, guideStat, qs, registerSW }
  from './assets/store.js';
import { ICON, ring, animateRings } from './assets/ui.js';
import { applyPrefOnly } from './assets/enhance.js';
applyPrefOnly(); registerSW();
$('#bk').innerHTML = ICON.back;
$('#lRead').innerHTML = ICON.book + ' Read';
$('#lCard').innerHTML = ICON.cards + ' Recall';
$('#ipdf').innerHTML = ICON.pdf; $('#ibook').innerHTML = ICON.book;

const id = qs('cc');
(async () => {
  const idx = await loadIndex();
  let meta = null;
  idx.parts.forEach(p => p.ccs.forEach(c => { if (c.id === id) meta = c; }));
  if (!meta) { location.href = 'index.html'; return; }
  const data = await loadCC(id);
  document.title = `CPX ${meta.num} ${meta.title}`;
  $('#sb').textContent = `CPX ${meta.num}`;
  $('#hno').textContent = meta.num;
  $('#hti').textContent = meta.title;
  $('#hen').textContent = meta.en;
  $('#mRead').href = 'read.html?cc=' + id;
  $('#mCard').href = 'cards.html?cc=' + id + '&d=0';
  $('#gl').href = 'guide.html?cc=' + id;
  $('#pl').href = 'guides/' + meta.guide + '.pdf';

  const counts = data.decks.map(d => d.cards.length);
  const s = ccStat(id, counts);
  const doc = await loadRead(id);
  const g = guideStat(id, doc.parts.map(p => p.secs.length));
  const all = Math.round((s.ok + g.done) / (s.total + g.total) * 100);

  $('#hring').innerHTML = ring(all, 56, 3).replace('class="ring"', 'class="ring big"');
  $('#hline').innerHTML =
    `<span><b>${g.done}</b> / ${g.total} 절 읽음</span><span><b>${s.ok}</b> / ${s.total} 장 외움</span>`;
  $('#rMeta').textContent = `${doc.parts.length}파트 · ${g.total}절`;
  $('#rBar').style.width = g.pct + '%'; $('#rPc').textContent = `${g.pct}%`;
  $('#cMeta').textContent = `${data.decks.length}덱 · ${s.total}장`;
  $('#cBar').style.width = s.pct + '%'; $('#cPc').textContent = `${s.pct}%`;
  $('#dcnt').textContent = `${data.decks.length}`;

  $('#list').innerHTML = data.decks.map((d, di) => {
    const st = deckStat(id, di, d.cards.length);
    return `<a class="row${st.pct === 100 ? ' done' : ''}" href="cards.html?cc=${id}&d=${di}">
      <span class="no sm">${di + 1}</span>
      <div class="mid"><b>${d.t}</b><span>${d.d}</span></div>
      <div class="end"><span class="n">${d.cards.length}장</span>
        <span class="mini"><i style="width:${st.pct}%"></i></span>${ICON.next}</div></a>`;
  }).join('');
  animateRings();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F4F6">
<title>CPX Study</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body>
<div class="scroll">
  <div class="hubtop" id="hubtop"><div class="in">
    <div class="top" style="padding-left:0;padding-right:0">
      <a class="rb ghost" href="index.html" id="bk"></a>
      <div class="tt w"><b id="sb"></b></div>
    </div>
    <div class="no" id="hno"></div>
    <h1 id="hti"></h1><div class="en" id="hen"></div>
    <div class="row">
      <div class="k"><b id="kOk">0</b><span>장 외움</span></div>
      <div class="k"><b id="kRead">0</b><span>절 읽음</span></div>
      <div class="k"><b id="kBad">0</b><span>다시 볼 것</span></div>
    </div>
  </div></div>
  <div class="w">
    <div class="modes">
      <a class="mode" id="mCard"><div class="ic" id="icC"></div><h3>카드 인출</h3><p id="cMeta"></p>
        <div class="bar"><i id="cBar"></i></div><div class="pc" id="cPc"></div></a>
      <a class="mode" id="mRead"><div class="ic" id="icR"></div><h3>학습모드</h3><p id="rMeta"></p>
        <div class="bar"><i id="rBar"></i></div><div class="pc" id="rPc"></div></a>
    </div>
    <div class="sech"><h2>덱</h2><span id="dcnt"></span></div>
    <div id="list"></div>
    <div class="links"><a id="pl" target="_blank"><span id="ipdf"></span>PDF</a><a id="gl"><span id="ibook"></span>가이드 전문</a></div>
  </div>
</div>
<script type="module">
import { $, loadIndex, loadCC, loadRead, deckStat, ccStat, guideStat, getCard, qs, registerSW } from './assets/store.js?v=8';
import { ICON } from './assets/ui.js?v=8';
import { applyPrefOnly } from './assets/enhance.js?v=8';
applyPrefOnly(); registerSW();
$('#bk').innerHTML = ICON.back; $('#icC').innerHTML = ICON.cards; $('#icR').innerHTML = ICON.book;
$('#ipdf').innerHTML = ICON.pdf; $('#ibook').innerHTML = ICON.book;
const id = qs('cc');
(async () => {
  const idx = await loadIndex(); let meta = null;
  idx.parts.forEach(p => p.ccs.forEach(c => { if (c.id === id) meta = c; }));
  if (!meta) { location.href = 'index.html'; return; }
  const [g1, g2] = meta.grad || ['#1B2A6B', '#6D3BE0'];
  document.documentElement.style.setProperty('--g1', g1); document.documentElement.style.setProperty('--g2', g2);
  document.querySelector('meta[name=theme-color]').content = g1;
  const data = await loadCC(id);
  document.title = `CPX ${meta.num} ${meta.title}`;
  $('#sb').textContent = `CPX ${meta.num}`; $('#hno').textContent = meta.num;
  $('#hti').textContent = meta.title; $('#hen').textContent = meta.en;
  $('#mRead').href = 'read.html?cc=' + id; $('#mCard').href = 'cards.html?cc=' + id + '&d=0';
  $('#gl').href = 'guide.html?cc=' + id; $('#pl').href = 'guides/' + meta.guide + '.pdf';
  const s = ccStat(id, data.decks.map(d => d.cards.length));
  let bad = 0; data.decks.forEach((d, di) => d.cards.forEach((_, ci) => { if (getCard(id, di, ci).ok === false) bad++; }));
  const doc = await loadRead(id); const g = guideStat(id, doc.parts.map(p => p.secs.length));
  $('#kOk').textContent = s.ok; $('#kRead').textContent = g.done; $('#kBad').textContent = bad;
  $('#cMeta').textContent = `${data.decks.length}덱 · ${s.total}장`; $('#cPc').textContent = `${s.pct}%`;
  $('#rMeta').textContent = `${doc.parts.length}파트 · ${g.total}절`; $('#rPc').textContent = `${g.pct}%`;
  $('#dcnt').textContent = data.decks.length + '개';
  $('#list').innerHTML = data.decks.map((d, di) => {
    const st = deckStat(id, di, d.cards.length);
    return `<a class="deck${st.pct === 100 ? ' done' : ''}" href="cards.html?cc=${id}&d=${di}">
      <div class="n">${st.pct === 100 ? ICON.check : di + 1}</div>
      <div class="t"><b>${d.t}</b><span>${d.d}</span></div>
      <div class="e"><b>${st.pct}%</b><span>${d.cards.length}장</span></div></a>`;
  }).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => { $('#cBar').style.width = s.pct + '%'; $('#rBar').style.width = g.pct + '%'; }));
})();
</script>
</body>
</html>

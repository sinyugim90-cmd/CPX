<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>CPX Study — 학습모드</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/style.css?v=16">
</head>
<body>

<div class="top"><div class="in">
  <button class="sq" id="bk"></button>
  <div class="tt"><b id="ti">학습모드</b><span id="sb"></span></div>
  <span class="cnt" id="rt"></span>
</div></div>

<div class="scroll" id="scroll"><div class="w">
  <div id="toc"></div>
  <div id="body" class="hide"></div>
</div></div>

<script type="module">
import { $, $$, loadIndex, loadRead, isRead, setRead, partStat, guideStat, qs, registerSW } from './assets/store.js?v=16';
import { ICON, animateRings, toast } from './assets/ui.js?v=16';
import { applyPrefOnly, highlight, zoomable, viewSettings } from './assets/enhance.js?v=16';
applyPrefOnly(); registerSW();
$('#bk').innerHTML = ICON.back;

const cc = qs('cc');
let meta = null, DOC = null, pi = null;

(async () => {
  const idx = await loadIndex();
  idx.parts.forEach(p => p.ccs.forEach(c => { if (c.id === cc) meta = c; }));
  if (!meta) { location.href = 'index.html'; return; }
  DOC = await loadRead(cc);
  document.title = `학습모드 — CPX ${meta.num}`;
  const p = qs('p');
  if (p !== null) openPart(+p); else showToc();
})();
const counts = () => DOC.parts.map(p => p.secs.length);
const tagNo = t => t.startsWith('PART') ? t.replace('PART ', '').padStart(2, '0') : (t === '표지' ? '00' : '++');

/* 목차 */
function showToc() {
  pi = null;
  $('#body').classList.add('hide'); $('#toc').classList.remove('hide');
  $('#ti').textContent = meta.title;
  $('#sb').textContent = `CPX ${meta.num} · 학습모드`;
  $('#bk').onclick = () => location.href = 'decks.html?cc=' + cc;
  const g = guideStat(cc, counts());
  $('#rt').innerHTML = `<b>${String(g.done).padStart(2,'0')}</b><small> / </small>${String(g.total).padStart(2,'0')}`;
  
  history.replaceState(null, '', `read.html?cc=${cc}`);
  $('#toc').innerHTML =
    `<div class="sech" style="padding-top:18px"><h2>Parts</h2><span>${DOC.parts.length} parts · ${g.total} sections</span></div>` +
    DOC.parts.map((p, n) => {
      const s = partStat(cc, n, p.secs.length);
      return `<button class="deck${s.pct === 100 ? ' done' : ''}" data-p="${n}">
        <div class="n">${tagNo(p.tag)}</div>
        <div class="t"><b>${p.title}</b><span>${p.secs.map(x => x.title).join(' · ')}</span></div>
        <div class="e">${s.done}/${p.secs.length}<small>sections</small></div></button>`;
    }).join('');
  $$('#toc .deck').forEach(b => b.onclick = () => openPart(+b.dataset.p));
  $('#scroll').scrollTop = 0;
}

/* 블록 렌더 */
const wrap = h => `<div><div class="ai">${h}</div></div>`;
function block(b) {
  switch (b.k) {
    case 'p': return `<p class="rp">${b.html}</p>`;
    case 'quote': return `<blockquote class="rq"><div class="who">${b.who}</div>` +
      b.lines.map(l => `<p>${l}</p>`).join('') + `</blockquote>`;
    case 'ask': return `<div class="ask"><button class="q"><span class="mk">Q</span><span>${b.q}</span></button>
      <div class="a">${wrap(b.blocks.map(block).join(''))}</div></div>`;
    case 'tbl': return `<div class="tw">${b.html}</div>`;
    case 'fig': return `<figure>${b.svg}<figcaption>${b.cap}</figcaption></figure>`;
    case 'list': return b.kind === 'flow' ? `<ol class="flow">${b.html}</ol>` : `<ul class="${b.kind}">${b.html}</ul>`;
    case 'dl': return `<dl class="rdl">` + b.rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('') + `</dl>`;
    case 'recall': return `<div class="recall"><div class="lb">${b.lb}</div>` + b.qs.map(q => `<p>${q}</p>`).join('') + `</div>`;
    case 'si': return `<div class="ask si2"><button class="q"><span class="mk">말</span><b>${b.code}</b>
        <em class="gd ${b.grade}">${b.grade}</em></button>
      <div class="a">${wrap(`<p class="why">${b.why}</p><div class="say">&ldquo;${b.say}&rdquo;</div>
        <div class="tw"><table><thead><tr><th>환자의 답</th><th>가리키는 것</th><th>그렇게 갈리는 이유</th></tr></thead>
        <tbody>${b.rows.map(r => `<tr><td>${r[0]}</td><td class="dx">${r[1]}</td><td class="rz">${r[2]}</td></tr>`).join('')}</tbody></table></div>`)}</div></div>`;
    case 'card': return `<div class="ask si2"><button class="q"><span class="mk">손</span><b>${b.nm}</b><em class="en">${b.en}</em></button>
      <div class="a">${wrap((b.svg ? `<figure>${b.svg}</figure>` : '') +
        b.dl.map(([k, v]) => `<div class="kv"><b>${k}</b><span>${v}</span></div>`).join(''))}</div></div>`;
    default: return '';
  }
}

/* 파트 본문 */
function openPart(n) {
  pi = n;
  const p = DOC.parts[n];
  $('#toc').classList.add('hide'); $('#body').classList.remove('hide');
  $('#ti').textContent = meta.title;
  $('#sb').textContent = `CPX ${meta.num} · ${p.tag}`;
  $('#bk').onclick = showToc;
  history.replaceState(null, '', `read.html?cc=${cc}&p=${n}`);

  $('#body').innerHTML =
    `<div class="rhead"><div class="pn">${p.tag}</div><h2>${p.title}</h2>${p.dek ? `<p>${p.dek}</p>` : ''}</div>
     <div class="tools">
       <button class="tbtn" id="allOpen">전부 펼치기</button>
       <button class="tbtn" id="allShut">전부 접기</button>
       <span class="vwrap"></span></div>` +
    p.secs.map((s, si) => {
      const r = isRead(cc, n, si);
      return `<section class="acc${r ? ' read' : ''}" data-s="${si}">
        <button class="ah"><span class="sq">${r ? ICON.check : si + 1}</span>
          <span class="at">${s.title}</span><span class="cv">${ICON.next}</span></button>
        <div class="ab"><div><div class="abi">
          ${s.sub ? `<p class="rsub">${s.sub}</p>` : ''}
          ${s.blocks.map(block).join('')}
          <button class="mark">${r ? ICON.check + ' 읽음' : '이 절 읽음'}</button>
        </div></div></div></section>`;
    }).join('') +
    `<div class="pnav">
       <button class="pbtn ic" id="prevP">${ICON.prev}</button>
       <button class="pbtn" id="toToc">목차</button>
       <button class="pbtn pri" id="doneP">다 읽음</button>
       <button class="pbtn ic" id="nextP">${ICON.next}</button></div>`;

  highlight($('#body')); zoomable($('#body')); viewSettings('#body .vwrap');
  bind(n); refresh();
  $('#prevP').disabled = (n === 0);
  $('#nextP').disabled = (n === DOC.parts.length - 1);
  $('#scroll').scrollTop = 0;
  const first = p.secs.findIndex((_, si) => !isRead(cc, n, si));
  const t = $$('#body .acc')[first < 0 ? 0 : first];
  if (t) t.classList.add('open');
}

function bind(n) {
  $$('#body .acc').forEach(sec => {
    sec.querySelector('.ah').onclick = () => sec.classList.toggle('open');
    sec.querySelector('.mark').onclick = e => {
      e.stopPropagation();
      const si = +sec.dataset.s, now = !isRead(cc, n, si);
      setRead(cc, n, si, now);
      sec.classList.toggle('read', now);
      sec.querySelector('.mark').innerHTML = now ? ICON.check + ' 읽음' : '이 절 읽음';
      sec.querySelector('.sq').innerHTML = now ? ICON.check : (si + 1);
      if (now) { sec.classList.remove('open'); const nx = sec.nextElementSibling; if (nx && nx.classList.contains('acc')) nx.classList.add('open'); }
      refresh();
    };
  });
  $$('#body .ask .q').forEach(q => q.onclick = () => q.parentElement.classList.toggle('open'));
  $('#allOpen').onclick = () => $$('#body .acc, #body .ask').forEach(x => x.classList.add('open'));
  $('#allShut').onclick = () => $$('#body .acc, #body .ask').forEach(x => x.classList.remove('open'));
  $('#toToc').onclick = showToc;
  $('#prevP').onclick = () => { if (pi > 0) openPart(pi - 1); };
  $('#nextP').onclick = () => { if (pi < DOC.parts.length - 1) openPart(pi + 1); };
  $('#doneP').onclick = () => {
    const k = DOC.parts[pi].secs.length;
    const all = [...Array(k).keys()].every(si => isRead(cc, pi, si));
    [...Array(k).keys()].forEach(si => setRead(cc, pi, si, !all));
    openPart(pi); toast(all ? '읽음을 풀었어요' : '이 파트 다 읽음');
  };
}
function refresh() {
  const g = guideStat(cc, counts());
  const s = partStat(cc, pi, DOC.parts[pi].secs.length);
  $('#rt').innerHTML = `<b>${String(s.done).padStart(2,'0')}</b><small> / </small>${String(s.total).padStart(2,'0')}`;
  
}
document.addEventListener('keydown', e => {
  if (pi === null) return;
  if (e.key === 'ArrowRight') $('#nextP').click();
  if (e.key === 'ArrowLeft') $('#prevP').click();
  if (e.key === 'Escape') showToc();
});
</script>
</body>
</html>

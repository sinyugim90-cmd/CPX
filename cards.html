<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>CPX Study</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/style.css?v=16">
</head>
<body class="study">
<div class="top"><div class="in">
  <a class="sq" id="bk"></a>
  <div class="tt"><b id="dTitle"></b><span id="dCC"></span></div>
  <span class="cnt"><b id="cur">01</b><small> / </small><span id="tot">01</span></span>
  <button class="sq" id="more" aria-label="메뉴"></button>
</div></div>
<div class="pips" id="pips"></div>
<div class="stage" id="stage"></div>
<div class="bot">
  <div class="acts">
    <button class="act sm" id="prev"></button>
    <button class="act no" id="mNo">다시</button>
    <button class="act mid" id="flip">뒤집기</button>
    <button class="act ok" id="mYes">외웠다</button>
    <button class="act sm" id="next"></button>
  </div>
  <div class="hintl" id="hintl">tap to flip · swipe to grade</div>
</div>
<div class="fin" id="fin"><div class="in">
  <div class="n" id="finN"></div><h3 id="finT"></h3><p id="finP"></p><div class="ls" id="finL"></div>
  <button class="fbtn" id="finB"></button><button class="fbtn ghost" id="finH">덱 목록으로</button>
</div></div>

<script type="module">
import { $, $$, loadIndex, loadCC, getCard, setCard, resetDeck, qs, registerSW } from './assets/store.js?v=16';
import { ICON, sheet, toast } from './assets/ui.js?v=16';
import { stamp } from './assets/body.js?v=16';
import { applyPrefOnly, highlight, zoomable } from './assets/enhance.js?v=16';
applyPrefOnly(); registerSW();
$('#bk').innerHTML = ICON.back; $('#more').innerHTML = ICON.more;
$('#prev').innerHTML = ICON.prev; $('#next').innerHTML = ICON.next;


const ccId = qs('cc'), dIdx = +(qs('d') || 0), startAt = qs('i') !== null ? +qs('i') : 0;
let meta = null, deckDef = null, base = [], deck = [], i = 0, only = false;
const stage = $('#stage');

(async () => {
  const idx = await loadIndex();
  idx.parts.forEach(p => p.ccs.forEach(c => { if (c.id === ccId) meta = c; }));
  if (!meta) { location.href = 'index.html'; return; }
  const data = await loadCC(ccId); deckDef = data.decks[dIdx];
  if (!deckDef) { location.href = 'decks.html?cc=' + ccId; return; }
  document.title = `${deckDef.t} — CPX ${meta.num}`;
  $('#dTitle').textContent = deckDef.t; $('#dCC').textContent = `CPX ${meta.num} · ${meta.title}`;
  $('#bk').href = 'decks.html?cc=' + ccId;
  base = deckDef.cards.map((c, n) => ({ c, n })); deck = base.slice();
  i = Math.max(0, Math.min(startAt, deck.length - 1));
  render();
})();

/* ── 렌더: 스택 3장 ── */
function stats(mt) {
  const cells = [];
  (mt || '').split('·').forEach(x => { const m = x.match(/<b>(.*?)<\/b>/);
    if (m) cells.push([m[1].replace(/개$/, ''), x.replace(/<[^>]*>/g, '').replace(/[0-9]+개?/g, '').trim()]); });
  return cells.length >= 2 ? `<div class="fs">${cells.slice(0, 3).map(c => `<div><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')}</div>` : '';
}
function cardHTML(e, pos) {
  const c = e.c, f = c.f, s = getCard(ccId, dIdx, e.n);
  const foot = stats(f.mt);
  return `<div class="sc c${pos}${s.ok === true ? ' ok' : ''}" data-n="${e.n}">
    <div class="stamp y">GOT IT</div><div class="stamp n">AGAIN</div>
    <div class="card-stamp">${stamp('GOT IT', 74)}</div>
    <div class="fc">
      <div class="f fr">
        <div class="ft"><span>${f.kk}</span><span class="seq">${String(i + pos + 1).padStart(2, '0')} / ${String(deck.length).padStart(2, '0')}</span></div>
        <div class="fm"><div class="big ${f.cls}">${f.big}</div>${f.nm ? `<div class="nm">${f.nm}</div>` : ''}${(!foot && f.mt) ? `<div class="mt">${f.mt}</div>` : ''}</div>
        ${foot}
      </div>
      <div class="f bk">
        <div class="bh"><span class="g">${c.t}</span><span class="n">${c.n || ''}</span><span class="c">${c.c || ''}</span></div>
        <div class="bd">${(f.chips && f.chips.length ? `<div class="sum"><span class="lab">이 카드의 뼈대 ${f.chips.length}</span><div class="chips">${f.chips.map(x => `<span>${x}</span>`).join('')}</div></div>` : '')}${c.b}</div>
      </div>
    </div></div>`;
}
function render() {
  stage.innerHTML = [0, 1, 2].filter(k => i + k < deck.length).reverse().map(k => cardHTML(deck[i + k], k)).join('');
  const topc = stage.querySelector('.c0');
  if (topc) { highlight(topc.querySelector('.bd')); zoomable(topc.querySelector('.bd')); bindDrag(topc); }
  $('#cur').textContent = String(i + 1).padStart(2, '0'); $('#tot').textContent = String(deck.length).padStart(2, '0');
  $('#prev').disabled = i === 0;
  pips();
}
function pips() {
  $('#pips').innerHTML = deck.map((e, n) => { const s = getCard(ccId, dIdx, e.n);
    const k = s.ok === true ? 'ok' : s.ok === false ? 'no' : s.seen ? 'seen' : '';
    return `<i class="${k}${n === i ? ' cur' : ''}"></i>`; }).join('');
}

/* ── 뒤집기 ── */
function flip() {
  const t = stage.querySelector('.c0'); if (!t) return;
  t.classList.toggle('flip');
  if (t.classList.contains('flip')) { const e = deck[i], s = getCard(ccId, dIdx, e.n); setCard(ccId, dIdx, e.n, { seen: 1, ok: s.ok }); pips(); }
}
$('#flip').onclick = flip;

/* ── 드래그 (포인터) ── */
let drag = null;
function bindDrag(el) {
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('.bd') && el.classList.contains('flip')) { drag = { el, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: false, scrollable: true }; }
    else drag = { el, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: false, scrollable: false };
    el.setPointerCapture?.(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!drag || drag.el !== el) return;
    drag.dx = e.clientX - drag.x0; drag.dy = e.clientY - drag.y0;
    if (!drag.moved) {
      if (Math.abs(drag.dx) < 8 && Math.abs(drag.dy) < 8) return;
      if (drag.scrollable && Math.abs(drag.dy) > Math.abs(drag.dx)) { drag = null; return; } // 뒷면 스크롤 우선
      drag.moved = true; el.classList.add('drag');
    }
    const r = drag.dx * 0.06;
    el.style.transform = `translate(${drag.dx}px, ${drag.dy * 0.25}px) rotate(${r}deg)`;
    const k = Math.min(1, Math.abs(drag.dx) / 110);
    el.querySelector('.stamp.y').style.opacity = drag.dx > 0 ? k : 0;
    el.querySelector('.stamp.n').style.opacity = drag.dx < 0 ? k : 0;
  });
  const up = e => {
    if (!drag || drag.el !== el) return;
    const d = drag; drag = null;
    el.classList.remove('drag');
    if (!d.moved) { if (!e.target.closest('.bd') || !el.classList.contains('flip')) flip(); return; }
    if (Math.abs(d.dx) > 110) throwCard(el, d.dx > 0);
    else { el.style.transform = ''; el.querySelectorAll('.stamp').forEach(s => s.style.opacity = 0); }
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
function throwCard(el, yes) {
  el.classList.add('fly');
  el.style.transform = `translate(${yes ? 700 : -700}px, ${-40}px) rotate(${yes ? 28 : -28}deg)`;
  el.style.opacity = '0';
  setCard(ccId, dIdx, deck[i].n, { seen: 1, ok: yes });
  setTimeout(() => { if (i === deck.length - 1) { pips(); finish(); } else { i++; render(); } }, 260);
}
$('#mYes').onclick = () => { const t = stage.querySelector('.c0'); if (t) throwCard(t, true); };
$('#mNo').onclick = () => { const t = stage.querySelector('.c0'); if (t) throwCard(t, false); };
$('#prev').onclick = () => { if (i > 0) { i--; render(); } };
$('#next').onclick = () => { if (i < deck.length - 1) { i++; render(); } else finish(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') $('#mYes').click(); if (e.key === 'ArrowLeft') $('#mNo').click();
  if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'Escape') location.href = 'decks.html?cc=' + ccId;
});

/* ── 메뉴 ── */
function shuffle() { deck = deck.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]); i = 0; render(); toast('섞었어요'); }
function onlyBad() { const f = base.filter(e => getCard(ccId, dIdx, e.n).ok === false);
  if (!only && !f.length) { toast('다시 볼 카드가 없어요'); return; }
  only = !only; deck = only ? f : base.slice(); i = 0; render(); toast(only ? `다시 볼 것 ${f.length}장` : '전체'); }
function reset() { resetDeck(ccId, dIdx); deck = base.slice(); i = 0; only = false; $('#fin').classList.remove('show'); render(); toast('초기화'); }
$('#more').onclick = () => sheet(deckDef.t, [
  { icon: ICON.shuffle, label: '섞기', on: shuffle },
  { icon: ICON.filter, label: only ? '전체 보기' : '다시 볼 것만', on: onlyBad },
  { icon: ICON.reset, label: '이 덱 초기화', on: reset, danger: true }]);

function finish() {
  const bad = base.filter(e => getCard(ccId, dIdx, e.n).ok === false);
  const done = base.filter(e => getCard(ccId, dIdx, e.n).ok === true).length;
  $('#finN').textContent = Math.round(done / base.length * 100) + '%';
  $('#finT').textContent = bad.length ? '아직 안 붙은 카드' : deckDef.t + ' 완주';
  $('#finP').textContent = bad.length ? '아래 카드만 다시 돌면 돼요.' : '섞어서 한 번 더 돌면 순서 의존이 빠져요.';
  $('#finL').innerHTML = bad.map(e => e.c.t).join(' · ');
  $('#finB').textContent = bad.length ? `다시 볼 것 ${bad.length}장 돌기` : '섞어서 한 번 더';
  $('#fin').classList.add('show');
}
$('#finB').onclick = () => { $('#fin').classList.remove('show');
  const bad = base.filter(e => getCard(ccId, dIdx, e.n).ok === false);
  if (bad.length) { only = true; deck = bad; i = 0; render(); } else shuffle(); };
$('#finH').onclick = () => location.href = 'decks.html?cc=' + ccId;
</script>
</body>
</html>
